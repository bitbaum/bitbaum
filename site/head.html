<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bitbaum</title>
<meta name="description" content="bitbaum. The work, each its own.">
<style>
@font-face { font-family: "Instrument Serif"; font-weight: 400; font-style: normal; font-display: swap; src: url("/fonts/instrument-serif-latin.woff2") format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 400 700; font-style: normal; font-display: swap; src: url("/fonts/inter-latin.woff2") format("woff2"); }
:root { --bg: hsl(0 0% 7%); --fg: hsl(0 0% 96%); --muted: hsl(0 0% 58%); --line: hsl(0 0% 16%); }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font-family: Inter, system-ui, sans-serif; }
a { color: inherit; text-decoration: none; }
.top { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center; gap: 1.5rem; padding: 1.1rem 4vw; background: hsl(0 0% 7% / 0.9); backdrop-filter: blur(10px); }
.mark { letter-spacing: 0.14em; font-size: 0.8rem; color: var(--muted); }
nav { display: flex; gap: 1.1rem; font-size: 0.85rem; color: var(--muted); }
nav a { border-bottom: 1px solid transparent; }
nav a:hover, nav a.on { color: var(--fg); border-color: var(--fg); }
h1 { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; letter-spacing: -0.03em; font-size: clamp(3.4rem, 8vw, 7.5rem); line-height: 0.9; margin: 0; padding: 8vh 6vw 6vh; max-width: 10ch; }
.group { padding: 0 6vw 2rem; }
.group h2 { margin: 2rem 0 0; font-size: 0.75rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); font-weight: 400; }
.row { display: grid; grid-template-columns: 1.4fr 1fr auto; gap: 1rem; align-items: baseline; border-top: 1px solid var(--line); padding: 1.15rem 0; }
.name { font-family: "Instrument Serif", Georgia, serif; font-size: clamp(2rem, 4vw, 3.6rem); letter-spacing: -0.03em; line-height: 1; }
.what { color: var(--muted); }
.door { color: var(--muted); font-size: 0.85rem; text-align: right; }
.row:hover .name { color: #fff; }
footer { padding: 2rem 6vw 3rem; color: var(--muted); font-size: 0.85rem; }
@media (max-width: 800px) {
  .row { grid-template-columns: 1fr; }
  .door { text-align: left; }
}
</style>
</head>
