<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bitbaum — the work, and what it is built from</title>
<meta name="description" content="bitbaum: products, client systems, and the shared packages they are all built from. One person, one box.">
<meta property="og:title" content="bitbaum">
<meta property="og:description" content="Products, client systems, and the shared packages they are all built from.">
<meta property="og:type" content="website">
<style>
@font-face { font-family: "Instrument Serif"; font-weight: 400; font-style: normal; font-display: swap; src: url("/fonts/instrument-serif-latin.woff2") format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 400 700; font-style: normal; font-display: swap; src: url("/fonts/inter-latin.woff2") format("woff2"); }

/*
 * HIERARCHY IS THE POINT.
 *
 * The previous version set every venture name at up to 3.6rem serif and the
 * section labels at 0.75rem muted — so 23 rows all shouted at one volume and
 * the structure that organised them was the quietest thing on the page. Sizes
 * here descend deliberately: hero > section > row name > supporting text, and
 * nothing below a section heading competes with it.
 */
:root {
  --bg:      hsl(24 12% 6%);
  --raised:  hsl(24 10% 9%);
  --fg:      hsl(30 12% 96%);
  --muted:   hsl(30 6% 68%);   /* ~7:1 on --bg */
  --dim:     hsl(30 5% 58%);   /* ~5:1, never below 0.8rem */
  --line:    hsl(30 6% 16%);
  --line-2:  hsl(30 6% 22%);
  --accent:  hsl(24 88% 62%);

  --w: 68rem;
  --serif: "Instrument Serif", Georgia, "Times New Roman", serif;
  --sans: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font-family: var(--sans); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }

.wrap { max-width: var(--w); margin: 0 auto; padding: 0 clamp(1.25rem, 5vw, 3rem); }

/* ── header ─────────────────────────────────────────────────────────────── */
.top { position: sticky; top: 0; z-index: 5; background: hsl(24 12% 6% / 0.86); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; padding-block: 0.85rem; }
.mark { font-family: var(--serif); font-size: 1.25rem; letter-spacing: -0.01em; }
.top nav { display: flex; gap: clamp(0.9rem, 2.5vw, 1.75rem); font-size: 0.875rem; color: var(--muted); }
.top nav a { padding-block: 0.15rem; border-bottom: 1px solid transparent; }
.top nav a:hover { color: var(--fg); border-color: var(--line-2); }

/* ── hero ───────────────────────────────────────────────────────────────── */
.hero { padding: clamp(3.5rem, 11vh, 7rem) 0 clamp(2.5rem, 6vh, 4rem); }
.hero h1 { font-family: var(--serif); font-weight: 400; letter-spacing: -0.025em; font-size: clamp(2.6rem, 7vw, 5rem); line-height: 1.02; margin: 0; max-width: 14ch; }
.lead { margin: 1.5rem 0 0; max-width: 46ch; color: var(--muted); font-size: clamp(1rem, 1.6vw, 1.15rem); line-height: 1.6; }
.stats { display: flex; flex-wrap: wrap; gap: 0.5rem 1.75rem; margin-top: 2.25rem; padding-top: 1.5rem; border-top: 1px solid var(--line); font-size: 0.875rem; color: var(--dim); }
.stats b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }

/* ── section heading: now clearly ABOVE its rows ────────────────────────── */
.group { padding-bottom: clamp(2.5rem, 6vh, 4rem); scroll-margin-top: 5rem; }
.sec { display: flex; align-items: baseline; gap: 0.75rem; margin: 0 0 0.25rem; padding-bottom: 0.9rem; border-bottom: 1px solid var(--line-2); }
.sec h2 { font-family: var(--serif); font-weight: 400; font-size: clamp(1.6rem, 3vw, 2.1rem); letter-spacing: -0.02em; margin: 0; }
/* A badge, not a footnote marker: a bare small number beside a heading reads
   as a reference mark and made "Products 9" look like a citation. */
.sec .count { font-size: 0.7rem; color: var(--muted); font-variant-numeric: tabular-nums; border: 1px solid var(--line-2); border-radius: 999px; padding: 0.1rem 0.5rem; align-self: center; }
.sec .note { margin-left: auto; font-size: 0.8rem; color: var(--dim); text-align: right; }

/* ── venture rows ───────────────────────────────────────────────────────── */
.row { display: grid; grid-template-columns: minmax(0, 15rem) minmax(0, 1fr) auto; gap: 0.35rem 2rem; align-items: baseline; padding: 1.05rem 0.75rem 1.05rem 0; border-bottom: 1px solid var(--line); margin-right: -0.75rem; border-radius: 3px; transition: background 120ms ease; }
a.row:hover { background: var(--raised); }
a.row:hover .door { color: var(--fg); }
a.row:hover .arrow { transform: translateX(3px); }
.name { font-family: var(--serif); font-size: 1.45rem; line-height: 1.2; letter-spacing: -0.015em; }
.what { color: var(--muted); font-size: 0.95rem; }
.door { color: var(--dim); font-size: 0.85rem; text-align: right; white-space: nowrap; }
.arrow { display: inline-block; transition: transform 120ms ease; }
/* Not live: legible, but unmistakably not a door you can walk through. */
.row.off .name, .row.off .what { color: var(--dim); }
.row.off .door { font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; border: 1px solid var(--line-2); border-radius: 999px; padding: 0.15rem 0.6rem; }

/* ── packages: a different KIND of object, so a different shape ─────────── */
.pkgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(20.5rem, 1fr)); gap: 0.85rem; margin-top: 1.4rem; }
.pkg { display: flex; flex-direction: column; gap: 0.6rem; background: var(--raised); border: 1px solid var(--line); border-radius: 10px; padding: 1.15rem 1.25rem 1.1rem; }
.pkg-top { display: flex; align-items: baseline; gap: 0.6rem; }
.pkg-name { font-family: var(--serif); font-size: 1.3rem; letter-spacing: -0.015em; }
.pkg-uses { margin-left: auto; font-size: 0.75rem; color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pkg-what { margin: 0; color: var(--muted); font-size: 0.9rem; line-height: 1.5; flex: 1; }
/* A cut-off install command is a command someone will paste wrong. Let a long
   one wrap at its own separators rather than scroll out of sight. */
.pkg-install { display: block; font-family: var(--mono); font-size: 0.75rem; line-height: 1.5; color: var(--fg); background: var(--bg); border: 1px solid var(--line-2); border-radius: 6px; padding: 0.5rem 0.65rem; overflow-wrap: anywhere; }
.pkg-links { display: flex; gap: 0.35rem; font-size: 0.78rem; color: var(--dim); margin-top: -0.15rem; }
.pkg-links a, .pkg-links span { display: inline-flex; align-items: center; min-height: 24px; padding: 0 0.5rem; border-radius: 5px; }
.pkg-links a:first-child { margin-left: -0.5rem; }
.pkg-links a { border: 1px solid transparent; }
.pkg-links a:hover { color: var(--accent); border-color: var(--line-2); background: var(--bg); }

/* ── origin: a ledger, because a proof is a row you check, not a card ──── */
.origin-lead { margin: 1.1rem 0 0; max-width: 62ch; color: var(--muted); font-size: 0.9rem; line-height: 1.55; }
.origin-lead a { border-bottom: 1px solid var(--line-2); }
.origin-lead a:hover { color: var(--fg); }
.ledger { margin-top: 1.25rem; border-top: 1px solid var(--line-2); font-variant-numeric: tabular-nums; }
.ledger-row, .ledger-head { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1.5fr) minmax(0, 1fr); gap: 0.25rem 1.5rem; align-items: baseline; padding: 0.7rem 0; border-bottom: 1px solid var(--line); font-size: 0.875rem; }
.ledger-head { padding-block: 0.55rem; font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
.ledger-name { font-family: var(--serif); font-size: 1.1rem; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.ledger-name:hover { color: var(--accent); }
.ledger-cell { color: var(--muted); }
.ledger-cell a { border-bottom: 1px solid var(--line-2); }
.ledger-cell a:hover { color: var(--fg); }
.ledger-dim { color: var(--dim); }
/* Column headers live in each cell and hide on wide screens: the layout is
   the header there, and on a phone the cells stack so each needs its name. */
.ledger-label { display: none; }

/* ── footer ─────────────────────────────────────────────────────────────── */
footer { border-top: 1px solid var(--line); margin-top: 1rem; }
footer .wrap { padding-block: 2.5rem 3.5rem; color: var(--dim); font-size: 0.85rem; display: flex; flex-wrap: wrap; gap: 0.5rem 2rem; }
footer a { border-bottom: 1px solid var(--line-2); }
footer a:hover { color: var(--fg); }

@media (max-width: 760px) {
  .row { grid-template-columns: 1fr; gap: 0.2rem; padding-block: 0.95rem; }
  .door { text-align: left; }
  .row.off .door { justify-self: start; }
  .name { font-size: 1.3rem; }
  /* Five nav items do not fit at 390px. Left alone they pushed the document
     23px wide and the whole page scrolled sideways — so the nav scrolls
     instead of the page, and no item is hidden to achieve it. */
  .top .wrap { gap: 1rem; }
  .top nav { gap: 1rem; min-width: 0; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .top nav::-webkit-scrollbar { display: none; }
  .top nav a { white-space: nowrap; }
  .ledger-head { display: none; }
  .ledger-dim { display: block; }
  .ledger-row { grid-template-columns: 1fr 1fr; gap: 0.3rem 1rem; padding-block: 0.85rem; }
  .ledger-name { grid-column: 1 / -1; }
  .ledger-label { display: block; font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.what .now { display: block; font-size: 0.78rem; color: var(--dim); margin-top: 0.2rem; }
.pillars { display: flex; flex-wrap: wrap; gap: 0.4rem 1.4rem; margin: 0.6rem 0 0.2rem; font-size: 0.85rem; color: var(--muted); }
.pillars b { color: var(--fg); font-weight: 600; }
</style>
</head>
