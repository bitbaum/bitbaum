<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bitbaum</title>
  <meta name="description" content="bitbaum is the parent company. Each venture is its own company.">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0a0a0a;
      --fg: #e8e8e8;
      --subtle: #6b6b6b;
      --rule: #1a1a1a;
      --hover-rule: #2a2a2a;
      --link: #a8a8a8;
    }

    @font-face {
      font-family: 'System';
      src: local('SF Pro Display'), local('Segoe UI'), local('Roboto'), local('Helvetica Neue'), local('Arial');
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: var(--bg);
      color: var(--fg);
      padding: 0;
      line-height: 1.3;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 4rem 2rem;
    }

    header {
      margin-bottom: 6rem;
    }

    .mark {
      width: 80px;
      height: 80px;
      margin-bottom: 3rem;
      opacity: 0.9;
    }

    .mark svg {
      width: 100%;
      height: 100%;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 400;
      letter-spacing: -0.03em;
      margin-bottom: 2rem;
      line-height: 1.1;
    }

    .intro {
      font-size: clamp(1.125rem, 2.5vw, 1.5rem);
      color: var(--subtle);
      font-weight: 300;
      line-height: 1.5;
      max-width: 42rem;
    }

    main {
      margin-top: 8rem;
    }

    .ventures {
      list-style: none;
    }

    .venture {
      border-top: 1px solid var(--rule);
      padding: 2.5rem 0;
      transition: border-color 0.4s ease;
    }

    .venture:hover {
      border-top-color: var(--hover-rule);
    }

    .venture-header {
      display: flex;
      align-items: baseline;
      gap: 1rem;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
    }

    .venture-name {
      font-size: clamp(1.75rem, 4vw, 3rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .venture-name a {
      color: var(--fg);
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .venture-name a:hover {
      color: var(--link);
    }

    .venture-kind {
      font-size: 0.875rem;
      color: var(--subtle);
      text-transform: lowercase;
      font-weight: 300;
      letter-spacing: 0.02em;
      opacity: 0.7;
    }

    .venture-tagline {
      font-size: clamp(1rem, 2vw, 1.25rem);
      color: var(--subtle);
      font-weight: 300;
      line-height: 1.4;
      margin-bottom: 0.5rem;
    }

    .venture-door {
      font-size: 0.9375rem;
      color: var(--subtle);
      font-weight: 300;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.4s ease, transform 0.4s ease;
      font-variant-numeric: tabular-nums;
    }

    .venture:hover .venture-door,
    .venture:focus-within .venture-door {
      opacity: 1;
      transform: translateY(0);
    }

    .venture-door a {
      color: var(--link);
      text-decoration: none;
    }

    .venture-door a:hover {
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    footer {
      margin-top: 8rem;
      padding: 3rem 0 4rem;
      border-top: 1px solid var(--rule);
      color: var(--subtle);
      font-size: 0.9375rem;
      font-weight: 300;
    }

    .error {
      padding: 2rem;
      background: #1a0a0a;
      border: 1px solid #3a0a0a;
      border-radius: 4px;
      color: #ff6b6b;
      font-size: 0.9375rem;
    }

    @media (max-width: 768px) {
      .container {
        padding: 3rem 1.5rem;
      }

      header {
        margin-bottom: 4rem;
      }

      main {
        margin-top: 5rem;
      }

      .venture {
        padding: 2rem 0;
      }

      .venture-header {
        gap: 0.75rem;
      }

      .venture-door {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="mark">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="110 76 180 202">
          <path fill="none" stroke="#e8e8e8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"
            d="M 200,120 C 195,93 173,87 152,99 C 128,114 128,126 152,141 C 173,153 195,147 200,120 C 205,93 227,87 248,99 C 272,114 272,126 248,141 C 227,153 205,147 200,120"/>
          <path fill="none" stroke="#e8e8e8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"
            d="M 200,232 C 195,205 173,199 152,211 C 128,226 128,238 152,253 C 173,265 195,259 200,232 C 205,205 227,199 248,211 C 272,226 272,238 248,253 C 227,265 205,259 200,232"/>
        </svg>
      </div>

      <h1>bitbaum</h1>
      <p class="intro">bitbaum is the parent company. Each venture below is its own company.</p>
    </header>

    <main>
      <ul id="ventures-list" class="ventures">
        <li class="error">Loading ventures...</li>
      </ul>
    </main>

    <footer>
      <p>Cato, Zürich</p>
    </footer>
  </div>

  <script>
    async function loadVentures() {
      const container = document.getElementById('ventures-list');
      
      try {
        const response = await fetch('./companies.json');
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        
        const data = await response.json();
        const ventures = data.companies;

        if (ventures.length === 0) {
          container.innerHTML = '<li class="error">No ventures to display.</li>';
          return;
        }

        container.innerHTML = ventures.map(venture => {
          const kindLabel = venture.kind || 'project';
          
          let doorDisplay = '';
          if (venture.url) {
            const urlDisplay = venture.url.replace(/^https?:\/\//, '');
            doorDisplay = `<div class="venture-door"><a href="${venture.url}">${urlDisplay}</a></div>`;
          }

          const nameContent = venture.url 
            ? `<a href="${venture.url}">${venture.name}</a>`
            : venture.name;

          return `
            <li class="venture">
              <div class="venture-header">
                <h2 class="venture-name">${nameContent}</h2>
                <span class="venture-kind">${kindLabel}</span>
              </div>
              <p class="venture-tagline">${venture.tagline}</p>
              ${doorDisplay}
            </li>
          `;
        }).join('');

      } catch (error) {
        container.innerHTML = `<li class="error">Error loading ventures: ${error.message}</li>`;
        console.error('Failed to load ventures:', error);
      }
    }

    loadVentures();
  </script>
</body>
</html>
