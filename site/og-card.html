<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The share card: what a link to bitbaum.orangecat.ch shows on X, LinkedIn,
     Slack or a messenger. Rendered to dist/og/studio.png by site/og.mjs.
     Deliberately carries NO counts — an image cannot be regenerated by a
     crawler's cache, so any number in it would go stale in someone's feed. -->
<style>
  /* The card wears what the site wears: the ink ground, the tree mark drawn
     by site/brand-mark.mjs (og.mjs puts it in; never paste an SVG here) and
     the site's green for the one accent (styles.css --baum). Orange is
     OrangeCat's, and Bitcoin's; this card carried it, and a second, older
     mark, for two months after the site stopped. */
  @font-face { font-family: "Inter"; font-weight: 400 700; src: url(fonts/inter-latin.woff2) format("woff2"); }
  html, body { margin: 0; width: 1200px; height: 630px; background: #1c1c1c; color: #ebebeb; font-family: "Inter", system-ui, sans-serif; }
  .card { box-sizing: border-box; width: 1200px; height: 630px; padding: 70px 80px 64px; display: flex; flex-direction: column; justify-content: space-between; border-top: 6px solid #3ee08f; }
  .mark [data-mark] { display: flex; }
  .mark { display: flex; align-items: center; gap: 16px; font-weight: 600; font-size: 34px; letter-spacing: -0.02em; }
  .mark svg { width: 40px; height: 40px; color: #ebebeb; }
  h1 { margin: 0; font-weight: 600; font-size: 104px; line-height: 0.98; letter-spacing: -0.04em; }
  .sub { margin: 26px 0 0; font-size: 31px; line-height: 1.35; color: #a6a6a6; letter-spacing: -0.01em; max-width: 920px; }
  .foot { display: flex; justify-content: space-between; align-items: baseline; font-size: 24px; color: #7a7a7a; }
  .foot b { color: #3ee08f; font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">
      <span data-mark></span>
      bitbaum
    </div>
    <div>
      <h1>One trunk.<br>Many products.</h1>
      <p class="sub">A studio, and a place for builders who work with agents. A person owns the judgement.</p>
    </div>
    <div class="foot"><span>Zürich · built in the open</span><b>bitbaum.orangecat.ch</b></div>
  </div>
</body>
</html>
