<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The share card: what a link to bitbaum.orangecat.ch shows on X, LinkedIn,
     Slack or a messenger. Rendered to dist/og/studio.png by site/og.mjs.
     Deliberately carries NO counts — an image cannot be regenerated by a
     crawler's cache, so any number in it would go stale in someone's feed. -->
<style>
  /* Colours match @bitbaum/design-tokens dark roles + OrangeCat public accent.
     OG raster cannot import the CSS package; keep these two hexes in sync with
     tokens.css --surface-base (dark) and --public-accent. */
  @font-face { font-family: "Inter"; font-weight: 400 700; src: url(fonts/inter-latin.woff2) format("woff2"); }
  html, body { margin: 0; width: 1200px; height: 630px; background: #1c1c1c; color: #ebebeb; font-family: "Inter", system-ui, sans-serif; }
  .card { box-sizing: border-box; width: 1200px; height: 630px; padding: 70px 80px 64px; display: flex; flex-direction: column; justify-content: space-between; border-top: 6px solid #ff5c00; }
  .mark { display: flex; align-items: center; gap: 16px; font-weight: 600; font-size: 34px; letter-spacing: -0.02em; }
  .mark svg { width: 30px; height: 34px; }
  h1 { margin: 0; font-weight: 600; font-size: 104px; line-height: 0.98; letter-spacing: -0.04em; }
  .sub { margin: 26px 0 0; font-size: 31px; line-height: 1.35; color: #a6a6a6; letter-spacing: -0.01em; max-width: 920px; }
  .foot { display: flex; justify-content: space-between; align-items: baseline; font-size: 24px; color: #7a7a7a; }
  .foot b { color: #ff5c00; font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">
      <svg viewBox="110 76 180 202" aria-hidden="true"><path fill="none" stroke="#ebebeb" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" d="M 200,120 C 195,93 173,87 152,99 C 128,114 128,126 152,141 C 173,153 195,147 200,120 C 205,93 227,87 248,99 C 272,114 272,126 248,141 C 227,153 205,147 200,120"/><path fill="none" stroke="#ebebeb" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" d="M 200,232 C 195,205 173,199 152,211 C 128,226 128,238 152,253 C 173,265 195,259 200,232 C 205,205 227,199 248,211 C 272,226 272,238 248,253 C 227,265 205,259 200,232"/></svg>
      bitbaum
    </div>
    <div>
      <h1>One trunk.<br>Many products.</h1>
      <p class="sub">AI-native products on open infrastructure — and the stack that lets more than one person build here.</p>
    </div>
    <div class="foot"><span>Zürich · MIT · open source</span><b>bitbaum.orangecat.ch</b></div>
  </div>
</body>
</html>
