name: Deploy Bitbaum site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-site.yml'
      - 'site/**'
      - 'ROADMAP.md'
      - 'CHANGELOG.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:
  # The site is a VIEW of Loki's fleet map, and a view rebuilt only on a push
  # here goes stale the moment a project changes there: on 2026-10-18 the work
  # page still called Diplodoctor "not built" hours after Loki knew it was a
  # running beta, because nobody had pushed to this repo since. Every three
  # hours the site rebuilds from the live sources; a run that changes no page
  # stops before committing or publishing anything.
  schedule:
    - cron: '41 */3 * * *'
  repository_dispatch:
    types: [package-registry-updated]

# One deploy of main at a time, whatever started it — a push, the schedule,
# or the auto-merge sweep re-arming after a merge. A run that changed a page
# commits refreshed snapshots to main, so two side by side race to push and
# one fails. A pull
# request's check builds offline and pushes nothing; it keeps its own lane.
concurrency:
  group: bitbaum-site-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read Playwright revision
        id: playwright
        run: node -p '"version=" + require("playwright/package.json").version' >> "$GITHUB_OUTPUT"
      - name: Cache Playwright Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm test
      # Every product page says its picture was "taken by a machine when this
      # site was built" — so take it. Until 2026-09-25 nothing did, and Solon's
      # shot was eleven days and a whole redesign stale. A site that fails to
      # load keeps its previous picture (shots.mjs logs FAILED and moves on).
      - name: Retake product screenshots
        if: github.event_name != 'schedule'
        run: node site/shots.mjs
      - name: Build from current fleet sources
        env:
          GH_TOKEN: ${{ github.token }}
          FLEET_PACKAGES_SHA: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.packages_sha || '' }}
        run: node site/build.mjs --require-fresh
      - name: Package card release contract
        run: node site/check-published-packages.mjs < site/dist/packages/index.html
      # map.json carries the time it was generated, so it differs on every
      # run; every other file is deterministic. Nothing else changed means
      # nothing to say, and a scheduled run ends here.
      - name: Anything new to publish?
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && git diff --quiet -- site/dist ':(exclude)site/dist/map.json'; then
            echo "No page changed since the last build; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Site check
        if: steps.changed.outputs.publish == 'true'
        run: node site/build.mjs --check
      # No text below WCAG AA in light or dark, on phone or desktop. Light mode
      # once shipped captions at 2.2:1 on the warm sky and nobody saw it here.
      - name: Contrast gate (built dist)
        if: steps.changed.outputs.publish == 'true'
        run: node site/check-contrast.mjs
      - name: Claims gate (built dist)
        if: steps.changed.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node site/check-claims.mjs
      - name: Theme gate against local dist
        if: steps.changed.outputs.publish == 'true'
        run: |
          python3 -m http.server 8731 --directory site/dist &
          echo $! > /tmp/bitbaum-http.pid
          sleep 1
          failures=0
          node site/check-theme.mjs http://127.0.0.1:8731 || failures=1
          node site/check-hire.mjs http://127.0.0.1:8731 || failures=1
          node site/check-studio.mjs http://127.0.0.1:8731 || failures=1
          node site/check-responsive.mjs http://127.0.0.1:8731 || failures=1
          node site/check-packages.mjs http://127.0.0.1:8731 || failures=1
          node site/check-cast.mjs http://127.0.0.1:8731 || failures=1
          [ "$failures" -eq 0 ]
          kill "$(cat /tmp/bitbaum-http.pid)" || true
      - name: Commit refreshed source snapshots and generated site
        if: steps.changed.outputs.publish == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/*.snapshot.json site/dist
          # Commit only what a reader could notice. Every build stamps a new
          # generatedAt, and a product screenshot differs by a few bytes
          # between two captures of the same page; committing that made a
          # new main tip on every run, the auto-merge sweep dispatched a
          # deploy for each new tip, and the two chased each other — one
          # bot commit every seven minutes, and no PR could merge because
          # main never had a verdict for its own tip (2026-10-19). A
          # screenshot rides along when something real changed; the box
          # gets the fresh pictures either way, because publish copies dist.
          real=$(git diff --cached -U0 -- site ':(exclude)site/dist/shots' \
            | grep -E '^[-+][^-+]' | grep -v '"generatedAt"' | head -1 || true)
          if [ -n "$real" ]; then
            git commit -m 'chore(site): refresh published registry snapshots'
            git push origin HEAD:main
          else
            echo "Only build stamps and screenshot noise changed; nothing to commit."
            git reset -q
          fi
      - name: Configure SSH
        if: steps.changed.outputs.publish == 'true'
        env:
          HETZNER_SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          HETZNER_IP: ${{ vars.HETZNER_IP }}
        run: |
          test -n "$HETZNER_SSH_PRIVATE_KEY"
          test -n "$HETZNER_IP"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$HETZNER_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HETZNER_IP" >> ~/.ssh/known_hosts
      - name: Publish and verify public pages
        if: steps.changed.outputs.publish == 'true'
        env:
          BOX: ubuntu@${{ vars.HETZNER_IP }}
        run: bash site/publish.sh
      - name: Hire form gate (live)
        if: steps.changed.outputs.publish == 'true'
        run: node site/check-hire.mjs https://bitbaum.orangecat.ch

  preview-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read Playwright revision
        id: playwright
        run: node -p '"version=" + require("playwright/package.json").version' >> "$GITHUB_OUTPUT"
      - name: Cache Playwright Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm test
      - run: node site/build.mjs --offline
      - name: Package card release contract
        run: node site/check-published-packages.mjs < site/dist/packages/index.html
      - run: node site/build.mjs --offline --check
      - name: Verify studio journeys and mobile geometry
        run: |
          python3 -m http.server 8731 --directory site/dist &
          sleep 1
          failures=0
          node site/check-theme.mjs http://127.0.0.1:8731 || failures=1
          node site/check-hire.mjs http://127.0.0.1:8731 || failures=1
          node site/check-studio.mjs http://127.0.0.1:8731 || failures=1
          node site/check-responsive.mjs http://127.0.0.1:8731 || failures=1
          node site/check-packages.mjs http://127.0.0.1:8731 || failures=1
          node site/check-cast.mjs http://127.0.0.1:8731 || failures=1
          [ "$failures" -eq 0 ]
